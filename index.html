<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Jeep Värmare</title>
  <link id="manifestLink" rel="manifest">
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #121212; color: #fff; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 420px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #2c2c2c; }
    .brand { display: flex; align-items: center; gap: 10px; }
    h1 { margin: 0; font-size: 22px; color: #f59e0b; letter-spacing: 1px; }
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #ef4444; }
    .badge.online { background: #10b981; }
    .card { background: #1e1e1e; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 12px 0; font-size: 13px; color: #a1a1aa; text-transform: uppercase; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: #fff; }
    button:active { transform: scale(0.97); }
    .btn-start { background: linear-gradient(135deg, #f97316, #dc2626); font-size: 19px; padding: 20px; }
    .btn-timer { background: #2563eb; padding: 11px; font-size: 14px; }
    .btn-off { background: #3f3f46; padding: 11px; font-size: 14px; }
    .btn-sec { background: #27272a; border: 1px solid #3f3f46; font-size: 14px; padding: 12px; }
    .btn-inst { background: #10b981; margin-bottom: 14px; display: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .t-row { display: grid; grid-template-columns: 1.3fr 1fr 0.7fr; gap: 8px; margin-bottom: 10px; }
    .t-row:last-child { margin-bottom: 0; }
    input[type="time"] { width: 100%; padding: 9px 4px; font-size: 17px; font-weight: bold; text-align: center; border-radius: 10px; border: 1px solid #3f3f46; background: #121212; color: #fff; color-scheme: dark; }
    .status-box { background: #121212; border: 1px solid #2c2c2c; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; color: #34d399; min-height: 55px; word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg width="54" height="30" viewBox="0 0 116 64" fill="none">
          <rect x="2" y="2" width="112" height="60" rx="14" fill="#27272a" stroke="#f59e0b" stroke-width="4"/>
          <circle cx="19" cy="32" r="10" fill="#121212" stroke="#fff" stroke-width="3"/>
          <circle cx="97" cy="32" r="10" fill="#121212" stroke="#fff" stroke-width="3"/>
          <path d="M37 15v34M44 15v34M51 15v34M58 15v34M65 15v34M72 15v34M79 15v34" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <h1>JEEP</h1>
      </div>
      <span id="connStatus" class="badge">Ansluter...</span>
    </header>

    <button id="installBtn" class="btn-inst" onclick="installeraApp()">📲 Installera helskärmsapp</button>

    <div class="card">
      <h2>Bränslevärmare</h2>
      <button class="btn-start" onclick="skicka('START')">🔥 STARTA VÄRMARE</button>
    </div>

    <div class="card">
      <h2>Schemalägg start</h2>
      <div class="t-row">
        <input type="time" id="timer1Input" value="06:45">
        <button class="btn-timer" onclick="stallaTimer(1)">⏰ Sätt T1</button>
        <button class="btn-off" onclick="skicka('TIMER1 OFF')">Av</button>
      </div>
      <div class="t-row">
        <input type="time" id="timer2Input" value="16:15">
        <button class="btn-timer" onclick="stallaTimer(2)">⏰ Sätt T2</button>
        <button class="btn-off" onclick="skicka('TIMER2 OFF')">Av</button>
      </div>
    </div>

    <div class="card">
      <h2>Status från bilen</h2>
      <div id="statusLog" class="status-box">Startar...</div>
      <div class="grid-2" style="margin-top: 10px;">
        <button class="btn-sec" onclick="skicka('STATUS')">🔄 Uppdatera</button>
        <button class="btn-sec" onclick="bekraftaWifi()">📶 Byt WiFi</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const c = document.createElement("canvas"); c.width = 192; c.height = 192;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#18181b"; ctx.fillRect(0, 0, 192, 192);
      ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 8; ctx.beginPath(); ctx.roundRect(16, 46, 160, 100, 24); ctx.stroke();
      ctx.fillStyle = "#121212"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(40, 96, 15, 0, 6.29); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(152, 96, 15, 0, 6.29); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f59e0b";
      for (let i = 0; i < 7; i++) ctx.fillRect(65 + i * 10, 66, 5, 60);

      const m = { name: "Jeep Värmare", short_name: "Jeep", start_url: location.href, display: "standalone", background_color: "#121212", theme_color: "#121212", icons: [{ src: c.toDataURL("image/png"), sizes: "192x192", type: "image/png" }] };
      document.getElementById("manifestLink").href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/json" }));
    })();

    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; document.getElementById("installBtn").style.display = "block"; });
    async function installeraApp() { if (!deferredPrompt) return; deferredPrompt.prompt(); if ((await deferredPrompt.userChoice).outcome === "accepted") document.getElementById("installBtn").style.display = "none"; deferredPrompt = null; }

    const brokerUrl = "wss://broker.emqx.io:8084/mqtt", topicCmd = "min_esp32/JEEP/cmd", topicStatus = "min_esp32/JEEP/status";
    const statusBadge = document.getElementById("connStatus"), statusLog = document.getElementById("statusLog");
    let ws = null, arAnsluten = false, pingTimer = null;

    function logga(text, farg = "#34d399") { statusLog.innerHTML = `<span style="color:${farg}">${text.replace(/Klocka:\s*\d{2}:\d{2}\s*\|\s*/g, "")}</span>`; }
    function encodeStr(s) { const b = new TextEncoder().encode(s); return [b.length >> 8, b.length & 0xff, ...b]; }
    function encodeLen(l) { const o = []; do { let d = l % 128; l = Math.floor(l / 128); if (l > 0) d |= 128; o.push(d); } while (l > 0); return o; }

    function startaAnslutning() {
      statusBadge.textContent = "Ansluter..."; statusBadge.classList.remove("online");
      logga("Ansluter till broker.emqx.io...", "#60a5fa");
      ws = new WebSocket(brokerUrl, "mqtt"); ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        const p = encodeStr("JeepWeb-" + Math.random().toString(16).substr(2, 8));
        const h =;
        ws.send(new Uint8Array([0x10, ...encodeLen(h.length + p.length), ...h, ...p]));
      };

      ws.onmessage = e => {
        const d = new Uint8Array(e.data), pt = d.at(0) >> 4;
        if (pt === 2 && d.at(3) === 0) {
          arAnsluten = true; statusBadge.textContent = "Moln Online"; statusBadge.classList.add("online");
          logga("Ansluten! Hämtar status...", "#60a5fa");
          const sub = [0, 1, ...encodeStr(topicStatus), 0];
          ws.send(new Uint8Array([0x82, ...encodeLen(sub.length), ...sub]));
          clearInterval(pingTimer);
          pingTimer = setInterval(() => { if (ws && ws.readyState === 1) ws.send(new Uint8Array([0xc0, 0])); }, 25000);
          setTimeout(() => skicka("STATUS"), 300);
        } else if (pt === 3) {
          let i = 1, m = 1, b; do { b = d.at(i++); m *= 128; } while ((b & 128) !== 0);
          const tl = (d.at(i) << 8) | d.at(i + 1); i += 2;
          const t = new TextDecoder().decode(d.slice(i, i + tl)); i += tl;
          if (((d.at(0) >> 1) & 3) > 0) i += 2;
          if (t === topicStatus) logga("JEEP: " + new TextDecoder().decode(d.slice(i)), "#34d399");
        }
      };

      ws.onerror = () => logga("Nätverksfel: Port 8084 blockerad.", "#ef4444");
      ws.onclose = () => { arAnsluten = false; clearInterval(pingTimer); statusBadge.textContent = "Frånkopplad"; statusBadge.classList.remove("online"); setTimeout(startaAnslutning, 3000); };
    }

    function skicka(k) {
      if (!arAnsluten || !ws || ws.readyState !== 1) return alert("Inte ansluten ännu.");
      const tb = encodeStr(topicCmd), mb = new TextEncoder().encode(k);
      ws.send(new Uint8Array([0x30, ...encodeLen(tb.length + mb.length), ...tb, ...mb]));
      logga("Skickade '" + k + "'...", "#f59e0b");
    }

    function stallaTimer(nr) { const t = document.getElementById("timer" + nr + "Input").value; if (t) skicka("TIMER" + nr + " " + t); }
    function bekraftaWifi() { if (confirm("Starta om bilen till JEEP-Setup?")) skicka("WIFI"); }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    startaAnslutning();
  </script>
</body>
</html>
